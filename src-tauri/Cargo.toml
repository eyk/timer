[package]
name = "timer"
version = "1.0.2"
description = "A quiet, keyboard-first timer."
authors = ["Walter Seethaler"]
edition = "2021"
license = "MIT"

[lib]
name = "timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_System_WindowsProgramming", "Win32_UI_Input_KeyboardAndMouse"] }
